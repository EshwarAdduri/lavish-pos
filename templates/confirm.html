{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<form method="post" class="card card-pad form" style="max-width:520px;margin:40px auto">
  {% csrf_token %}
  <h1>{{ title }}</h1><p>{{ text }}</p>
  <div class="row"><button class="btn btn-danger btn-lg">Yes, delete</button><a class="btn btn-lg btn-ghost" href="{{ back }}">No, go back</a></div>
</form>
{% endblock %}
